name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require successful external checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: pnpm run verify
      - run: pnpm run check:action
      - name: Publish with provenance
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Advance Action major tag after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-action-tag.mjs
